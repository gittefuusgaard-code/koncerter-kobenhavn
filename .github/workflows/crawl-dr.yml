name: Update DR concerts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/crawl-dr.mjs
      - name: Upload DR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-crawler-diagnostics
          path: artifacts/dr-diagnostics.json
          if-no-files-found: ignore
      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dr-concerts.json
          git diff --cached --quiet || (git commit -m "Update DR Koncerthuset concert data" && git pull --rebase && git push)
