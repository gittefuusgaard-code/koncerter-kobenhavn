name: Update concert discovery history
on:
  workflow_dispatch:
  schedule:
    - cron: '55 */3 * * *'
permissions:
  contents: write
concurrency:
  group: concert-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-concert-history.mjs
      - name: Save concert discovery history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/concert-history.json
          git diff --cached --quiet || (git commit -m "Record newly discovered concerts" && git pull --rebase && git push)
