name: Update direct venue concerts
on:
  workflow_dispatch:
  schedule:
    - cron: '45 */3 * * *'
permissions:
  contents: write
concurrency:
  group: direct-venues
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/crawl-direct-venues.mjs
      - name: Save direct venue concerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/direct-venues.json
          git diff --cached --quiet || (git commit -m "Refresh direct venue concert data" && git pull --rebase && git push)
